<!DOCTYPE html>
<html>

<head>

    <title>PocketSmart - Party Plan</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .header {
            background: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: 35px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2, h3 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 94%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }

        .item {
            background: #f8f8f8;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
        }

        .total {
            background: #333;
            color: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }

        .success {
            background: #e8f5e9;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .warning {
            background: #fff3cd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            text-align: center;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>🎉 PocketSmart</h1>

    <p>Smart Party Planning System</p>

</div>



<div class="box">

    <h2>🎉 Party Budget Planner</h2>


    <label>Party Type</label>

    <select id="party">

        <option>Birthday Party</option>

        <option>Wedding Party</option>

        <option>College Event</option>

        <option>Anniversary</option>

    </select>



    <label>Number of Guests</label>

    <input
        type="number"
        id="guests"
        placeholder="Example: 50"
        min="1">



    <label>Total Budget</label>

    <input
        type="number"
        id="budget"
        placeholder="Example: 20000"
        min="1">



    <button onclick="createPartyPlan()">

        🎉 Create Party Plan

    </button>


    <div id="result"></div>


</div>



<script>


function money(value) {

    return "₹" + Math.round(value).toLocaleString("en-IN");

}



function createPartyPlan() {


    let party =
        document.getElementById("party").value;


    let guests =
        Number(document.getElementById("guests").value);


    let budget =
        Number(document.getElementById("budget").value);



    if (guests <= 0 || budget <= 0) {

        document.getElementById("result").innerHTML =

            "<div class='warning'>" +

            "⚠️ Please enter valid guest count and budget." +

            "</div>";

        return;

    }



    // Budget allocation

    let food = budget * 0.40;

    let decoration = budget * 0.15;

    let music = budget * 0.10;

    let cake = budget * 0.10;

    let photography = budget * 0.10;

    let gifts = budget * 0.10;

    let other = budget * 0.05;



    let total =

        food +
        decoration +
        music +
        cake +
        photography +
        gifts +
        other;



    // Food per guest

    let foodPerGuest = food / guests;



    let content = "";



    content +=

        "<h3>📋 " + party + " Plan</h3>";



    content +=

        "<div class='item'>" +

        "<span>👥 Guests</span>" +

        "<b>" + guests + "</b>" +

        "</div>";



    content +=

        "<div class='item'>" +

        "<span>🍽️ Food</span>" +

        "<b>" + money(food) + "</b>" +

        "</div>";



    content +=

        "<div class='item'>" +

        "<span>🎈 Decoration</span>" +

        "<b>" + money(decoration) + "</b>" +

        "</div>";



    content +=

        "<div class='item'>" +

        "<span>🎵 Music</span>" +

        "<b>" + money(music) + "</b>" +

        "</div>";



    content +=

        "<div class='item'>" +

        "<span>🎂 Cake</span>" +

        "<b>" + money(cake) + "</b>" +

        "</div>";



    content +=

        "<div class='item'>" +

        "<span>📸 Photography</span>" +

        "<b>" + money(photography) + "</b>" +

        "</div>";



    content +=

        "<div class='item'>" +

        "<span>🎁 Gifts</span>" +

        "<b>" + money(gifts) + "</b>" +

        "</div>";



    content +=

        "<div class='item'>" +

        "<span>📦 Other Expenses</span>" +

        "<b>" + money(other) + "</b>" +

        "</div>";



    content +=

        "<div class='total'>" +

        "💰 Total Planned Budget: " +

        money(total) +

        "</div>";



    content +=

        "<div class='success'>" +

        "✅ Your " +

        party +

        " for " +

        guests +

        " guests has been planned successfully!" +

        "<br><br>" +

        "🍽️ Food Budget Per Guest: " +

        money(foodPerGuest) +

        "</div>";



    document.getElementById("result").innerHTML = content;

}


</script>


</body>

</html>
